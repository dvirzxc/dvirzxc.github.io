            <script>
              window.injectedData = {"nodeData":{"topic":"(Lubinski, 2000)","id":"root","children":[{"dangerouslySetInnerHTML":"<h2>Característiques de l'article</h2>","id":"21","children":[{"dangerouslySetInnerHTML":"<h3>Objecte</h3>","id":"55","children":[{"dangerouslySetInnerHTML":"<h4>Diferències psicològiques individuals (atributs) que interactuen entre si.</h4>","id":"68","children":[]},{"dangerouslySetInnerHTML":"<h4>Metàfora de cadascun dels atributs com a túnels de prospecció minera (deep shafts) (Galton, 1890)</h4>","id":"149","children":[]}]},{"dangerouslySetInnerHTML":"<h3>Metodologia</h3>","id":"253","children":[{"dangerouslySetInnerHTML":"<h4>Article de revisió</h4>","id":"270","children":[]},{"dangerouslySetInnerHTML":"<h4>Selecció d'articles que fonamenten els atributs de Capacitats Cognitives (Cognitive Abilities), Interessos i Personalitat com a referència de l'estat actual en la recerca.</h4>","id":"295","children":[]},{"dangerouslySetInnerHTML":"<h4>Selecció d'articles que combinen aquests tres atributs en «constel·lacions».</h4>","id":"473","children":[]}]},{"dangerouslySetInnerHTML":"<h3>Contribució</h3>","id":"557","children":[{"dangerouslySetInnerHTML":"<h4>Comprensió holística i sistemàtica del rol conjunt de diversos atributs estudiats per la psicologia diferencial</h4>","id":"574","children":[]},{"dangerouslySetInnerHTML":"<h4>Contribuir a la teoria del «niche building»</h4>","id":"692","children":[{"dangerouslySetInnerHTML":"<h5>La forma en què persones amb diferències individuals específiques construeixen el seu nínxol, la seva forma de vida, entorn aquestes diferències.</h5>","id":"742","children":[]},{"dangerouslySetInnerHTML":"<h5>Per entendre les grans divisions en el coneixement (científics i humanistes (Snow, 1967)) o en el camp de la psicologia (psicòlegs que treballen directament amb persones i els que no)</h5>","id":"895","children":[]},{"dangerouslySetInnerHTML":"<h5>Per a què la psicologia diferencial pugui proveir eines per facilitar l'empatia intercultural (Dawis, 1992)</h5>","id":"1086","children":[]}]}]}]},{"dangerouslySetInnerHTML":"<h2>Atributs disposicionals</h2>","id":"1201","children":[{"dangerouslySetInnerHTML":"<h3>Capacitats Cognitives</h3>","id":"1229","children":[{"dangerouslySetInnerHTML":"<h4>Intel·ligència General (factor \"g\")</h4>","id":"1257","children":[{"dangerouslySetInnerHTML":"<h5>Constructe</h5>","id":"1299","children":[{"dangerouslySetInnerHTML":"<h6>Definició psicomètrica de Carroll &#x26; Jensen</h6>","id":"1317","children":[{"dangerouslySetInnerHTML":"<p>####### \"g\" com a covariància transversal a un sistema extern de diferents mitjans de ressolució de problemes (numèric, pictòric i verbal), un sistema intern de modalitats d'avaluació (grupal, individual) i poblacions (intercultural).</p>","id":"1369","children":[]},{"dangerouslySetInnerHTML":"<p>####### extern perque son dades externes, intern perque son modificacions de la modalitat d'avaluació per a sí mateixa</p>","id":"1605","children":[]}]},{"dangerouslySetInnerHTML":"<h6>Consens en la definició \"literària\" del constructe (Snyderman &#x26; Rothman, 1987)</h6>","id":"1725","children":[{"dangerouslySetInnerHTML":"<p>####### Raonament abstracte</p>","id":"1812","children":[]},{"dangerouslySetInnerHTML":"<p>####### Capacitat d'adquisició de coneixement</p>","id":"1841","children":[]},{"dangerouslySetInnerHTML":"<p>####### Capacitat de resolució de problemes</p>","id":"1888","children":[]}]}]},{"dangerouslySetInnerHTML":"<h5>Dimensionalitat i organització - jerarquia estratificada (Carroll, 1993)</h5>","id":"1933","children":[{"dangerouslySetInnerHTML":"<h6>Estrat III - diferències individuals més comunes a totes les manifestcaions de capacitat cognitiva (intel·ligència, factor \"g\")</h6>","id":"2013","children":[]},{"dangerouslySetInnerHTML":"<h6>Estrat II - capacitats matemàtiques, espacial-mecàniques i de raonament verbal</h6>","id":"2149","children":[]},{"dangerouslySetInnerHTML":"<h6>Estrat I - capacitats específiques (proves específiques): raonament aritmètic, disseny amb blocs, vocabulari, etc.</h6>","id":"2236","children":[]}]}]},{"dangerouslySetInnerHTML":"<h4>Capacitats Cognitives més enllà de \"g\"</h4>","id":"2359","children":[{"dangerouslySetInnerHTML":"<h5>Problema</h5>","id":"2404","children":[{"dangerouslySetInnerHTML":"<h6>El factor \"g\" ja ens està explicant un 50% de la variància, i no sabem quina part de la resta de la variància és relevant per la mesura del constructe.</h6>","id":"2420","children":[]}]},{"dangerouslySetInnerHTML":"<h5>Solució</h5>","id":"2580","children":[{"dangerouslySetInnerHTML":"<h6>Seguint la mesura del factor general \"g\", podem anar incloent variables en múltiples equacions de regressió a mesura que ens baixem en la jerarquia de capactiats cognitives.</h6>","id":"2595","children":[]},{"dangerouslySetInnerHTML":"<h6>Això permet obtindre dimensións moleculars amb un estatus de significància psicològica, que han de demostrar correlats diferencials amb altres variables (validesa de constructe externa)</h6>","id":"2777","children":[]}]}]},{"dangerouslySetInnerHTML":"<h4>Diferències Grupals - Variabilitat intergrupal vs. intragrupal</h4>","id":"2971","children":[{"dangerouslySetInnerHTML":"<h5>En unitats de desviació estàndard, el rang dins una població donada (raça o sexe, intragrupal) supera en molt a la diferència entre mitjanes poblacionals (intergrupal).</h5>","id":"3040","children":[]},{"dangerouslySetInnerHTML":"<h5>Això implica que els rangs de totes les poblacions con comparables, de manera que el talent es troba present en totes elles.</h5>","id":"3216","children":[]},{"dangerouslySetInnerHTML":"<h5>Diferències en els paràmetres de distribució entre poblacions</h5>","id":"3348","children":[{"dangerouslySetInnerHTML":"<h6>Fins a una desviació típica de diferència entre població blanca i negra</h6>","id":"3417","children":[]}]}]},{"dangerouslySetInnerHTML":"<h4>Diferències entre sexes</h4>","id":"3497","children":[{"dangerouslySetInnerHTML":"<h5>Distribució en intel·ligència general</h5>","id":"3527","children":[{"dangerouslySetInnerHTML":"<h6>Mitjanes comparables entre els sexes</h6>","id":"3572","children":[]},{"dangerouslySetInnerHTML":"<h6>Variabilitat lleugerament més alta en homes</h6>","id":"3617","children":[]}]},{"dangerouslySetInnerHTML":"<h5>Diferències en estrats més específics de la intel·ligència</h5>","id":"3669","children":[{"dangerouslySetInnerHTML":"<h6>Mesures verbals/lingüístiques més elevades en dones</h6>","id":"3735","children":[]},{"dangerouslySetInnerHTML":"<h6>Mesures quantitatives i espaials/mecàniques més elevades en homes</h6>","id":"3795","children":[{"dangerouslySetInnerHTML":"<p>####### Especialment amb mitjanes més elevades i variàncies més grans en proves de raonament no verbal, que donen lloc a ratios enormes en la cua superior.</p>","id":"3869","children":[]}]}]}]},{"dangerouslySetInnerHTML":"<h4>Diferències entre races</h4>","id":"4026","children":[{"dangerouslySetInnerHTML":"<h5>Aproximadament una desviació típica de diferència en intel·ligència general entre població blanca i negra (en favor de la blanca)</h5>","id":"4056","children":[]},{"dangerouslySetInnerHTML":"<h5>Població llatinoamericana amb puntuacions entre blancs i negres</h5>","id":"4193","children":[]},{"dangerouslySetInnerHTML":"<h5>Poblacions asiàtica i jueva lleugerament per sobre de la blanca</h5>","id":"4264","children":[]},{"dangerouslySetInnerHTML":"<h5>S'ha comprovat que les proves no es troben esbiaixades, prediuen correctament el rendiment intel·lectual.</h5>","id":"4335","children":[]}]},{"dangerouslySetInnerHTML":"<h4>Efecte Flynn</h4>","id":"4448","children":[{"dangerouslySetInnerHTML":"<h5>Efecte Flynn: increment transcultural de les mesures d'intel·ligència general durant l'últim segle</h5>","id":"4467","children":[]},{"dangerouslySetInnerHTML":"<h5>No es sap si realment es deu a increments reals en intel·ligència general</h5>","id":"4573","children":[]},{"dangerouslySetInnerHTML":"<h5>Hi ha evidència que indica que, al menys en part, es deu a aspectes mesurats per les proves que son irrellevants pel constructe d'intel·ligència general</h5>","id":"4654","children":[]},{"dangerouslySetInnerHTML":"<h5>És probable que les puntuacions hagin incrementat pels avenços en medicina, dieta i oportunitats educatives</h5>","id":"4814","children":[]},{"dangerouslySetInnerHTML":"<h5>Sembla ser que persones dotades amb nivells més alts de \"g\" han patit entrabancs com a resultat de ser privats d'oportunitats adeqüades en el seu desenvolupament (reptes acadèmics en el moment adequat)</h5>","id":"4929","children":[]},{"dangerouslySetInnerHTML":"<h5>La validesa de constructe es manté intacta tot i l'efecte Flynn, un increment en la mitjana de mesures amb validesa de constructe no reflecteix canvis en la estructura de covariància interna ni externa</h5>","id":"5138","children":[]}]},{"dangerouslySetInnerHTML":"<h4>Exploració Horitzontal i Vertical</h4>","id":"5348","children":[{"dangerouslySetInnerHTML":"<h5>Dos nivells d'anàlisi pels constructes</h5>","id":"5388","children":[{"dangerouslySetInnerHTML":"<h6>IV - Constructes com a \"variables intervinents\" [Horitzontal]</h6>","id":"5434","children":[{"dangerouslySetInnerHTML":"<p>####### Xarxa de relacions empíriques observades amb mesures a nivell conductual.</p>","id":"5504","children":[]},{"dangerouslySetInnerHTML":"<p>####### Més descriptives</p>","id":"5587","children":[]}]},{"dangerouslySetInnerHTML":"<h6>HC - Constructes com a \"constructes hipotètics\" [Vertical]</h6>","id":"5613","children":[{"dangerouslySetInnerHTML":"<p>####### Processos que subjauen o mecanismes encarregats de generar aquestes manifestacions fenotípiques observades a nivell conductual.</p>","id":"5680","children":[]},{"dangerouslySetInnerHTML":"<p>####### Més explicatives</p>","id":"5817","children":[]}]}]},{"dangerouslySetInnerHTML":"<h5>La psicologia diferencial ha identificat el factor g en l'anàlisi hortizontal (IV), ara és moment d'identificar-ne els correlats biològics (mecanismes i processos que subjauen el fenomen). Alguns correlats:</h5>","id":"5843","children":[{"dangerouslySetInnerHTML":"<h6>0.30-0.40 Intel·ligència general / Mida de l'encèfal ajustada per massa corporal</h6>","id":"6057","children":[]},{"dangerouslySetInnerHTML":"<h6>Metabolisme de la glucosa / Conducta de resolució de problemes</h6>","id":"6146","children":[{"dangerouslySetInnerHTML":"<p>####### En g més elevada, menys consum energètic i resolució de problemes més eficient</p>","id":"6217","children":[]}]},{"dangerouslySetInnerHTML":"<h6>Intel·ligència general / Complexitat d'ones en EEG</h6>","id":"6305","children":[]},{"dangerouslySetInnerHTML":"<h6>Intel·ligència general / amplitud i latència del potencial evocat mitjà (AEP) en EEG</h6>","id":"6364","children":[]},{"dangerouslySetInnerHTML":"<h6>Intel·ligència general / arborització dendrítica</h6>","id":"6457","children":[]},{"dangerouslySetInnerHTML":"<h6>Intel·ligència general / determinats marcadors d'ADN</h6>","id":"6514","children":[]}]},{"dangerouslySetInnerHTML":"<h5>Hipòtesi de la mielinació</h5>","id":"6575","children":[{"dangerouslySetInnerHTML":"<h6>Diferències individuals cognitives com a funció de diferències individuals en la mielinació de les neurones</h6>","id":"6608","children":[]}]}]},{"dangerouslySetInnerHTML":"<h4>Associacions Últimes amb \"g\"</h4>","id":"6725","children":[{"dangerouslySetInnerHTML":"<h5>El descobriment de correlats biològics ha dut a la exploració de possibles causes distants (últimes)</h5>","id":"6760","children":[]},{"dangerouslySetInnerHTML":"<h5>Impulsos de producció d'experiència (EPD - Experience Producing Drives)</h5>","id":"6868","children":[{"dangerouslySetInnerHTML":"<h6>Disposicions heretades que motiven els individus en direcció a tipus particulars d'experiències i oportunitats de desenvolupament.</h6>","id":"6947","children":[]},{"dangerouslySetInnerHTML":"<h6>Operen en un ampli ventall
